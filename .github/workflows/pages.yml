name: Bella Pages artifact isolation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified artifact to Bella production
        required: true
        default: false
        type: boolean
      confirmation:
        description: Type DEPLOY_BELLA_PRODUCTION
        required: true
        default: ''
        type: string
      expected_sha:
        description: Exact main commit SHA authorized for deployment
        required: true
        default: ''
        type: string

permissions:
  contents: read

jobs:
  prepare-surgical-pr:
    name: One-time authorized PR 19 preparation
    if: >-
      ${{ github.event_name == 'pull_request' &&
          (github.event.action == 'opened' || github.event.action == 'synchronize') &&
          github.event.pull_request.number == 19 &&
          github.event.pull_request.head.ref == 'seo/bella-surgical-dentistry-page' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.repository == 'optidigitalagent/bella' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Generate, verify, commit and push the bounded surgical release
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          rm -rf "$RUNNER_TEMP/bella-pr19-work"
          git init "$RUNNER_TEMP/bella-pr19-work"
          git -C "$RUNNER_TEMP/bella-pr19-work" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/bella-pr19-work" fetch --no-tags --depth=50 origin "$HEAD_REF"
          git -C "$RUNNER_TEMP/bella-pr19-work" checkout -B "$HEAD_REF" FETCH_HEAD
          git -C "$RUNNER_TEMP/bella-pr19-work" fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          cd "$RUNNER_TEMP/bella-pr19-work"

          if [ ! -d scripts/.pr19-generator ]; then
            echo 'One-time preparation helper is absent; the branch is already prepared.'
            exit 0
          fi

          cat scripts/.pr19-generator/*.part | base64 --decode > "$RUNNER_TEMP/prepare-bella-pr19.py"
          python -B "$RUNNER_TEMP/prepare-bella-pr19.py" | tee "$RUNNER_TEMP/bella-pr19-generation.json"
          git diff --cached --check
          python -B -m unittest -v tests/test_pages_artifact_isolation.py
          python -B scripts/build-pages-artifact.py > "$RUNNER_TEMP/bella-pr19-build.json"
          python -B scripts/verify-pages-artifact.py > "$RUNNER_TEMP/bella-pr19-verify.json"
          for js in clinic-life.js prices.js sheets-loader.js site-config.js; do
            node --check "$js"
          done
          test -s _site/khirurhichna-stomatolohiia.html
          cmp -s khirurhichna-stomatolohiia.html _site/khirurhichna-stomatolohiia.html
          rm -rf _site

          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git commit -m 'feat(seo): add Kryvyi Rih surgical dentistry page'

          expected_paths=$'.github/workflows/pages.yml\nindex.html\nkhirurhichna-stomatolohiia.html\npages-public-manifest.txt\nprice.html\nsitemap.xml\ntests/test_pages_artifact_isolation.py'
          actual_paths="$(git diff --name-only origin/main...HEAD | sed '/^$/d' | sort -u)"
          if [ "$actual_paths" != "$expected_paths" ]; then
            printf 'Unexpected final PR scope.\nExpected:\n%s\nActual:\n%s\n' "$expected_paths" "$actual_paths" >&2
            exit 1
          fi

          git push origin "HEAD:${HEAD_REF}"
          printf 'Prepared head SHA: %s\n' "$(git rev-parse HEAD)"

  build:
    name: Build and verify isolated artifact
    if: >-
      ${{ github.event_name != 'pull_request' ||
          github.event.action != 'closed' ||
          github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Run isolation tests
        run: python -m unittest -v tests/test_pages_artifact_isolation.py
      - name: Build public artifact
        run: python scripts/build-pages-artifact.py
      - name: Verify public artifact
        run: python scripts/verify-pages-artifact.py
      - name: Smoke-check artifact entry points
        run: |
          python - <<'PY'
          from pathlib import Path
          for entry in ('index.html', 'price.html', 'khirurhichna-stomatolohiia.html'):
              path = Path('_site', entry)
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'missing or empty artifact entry point: {entry}')
          PY
      - name: Upload isolated Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: _site
          retention-days: 1
          include-hidden-files: true

  deploy:
    name: Manual exact-SHA production deploy
    needs: build
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' &&
         inputs.deploy == true &&
         inputs.confirmation == 'DEPLOY_BELLA_PRODUCTION' &&
         inputs.expected_sha == github.sha &&
         github.repository == 'optidigitalagent/bella' &&
         github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' &&
         github.event.action == 'closed' &&
         github.event.pull_request.merged == true &&
         github.event.pull_request.number == 19 &&
         github.event.pull_request.head.ref == 'seo/bella-surgical-dentistry-page' &&
         github.event.pull_request.base.ref == 'main' &&
         github.repository == 'optidigitalagent/bella' &&
         github.ref == 'refs/heads/main')
      }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy the artifact from this run
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
