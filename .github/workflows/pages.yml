name: Bella Pages artifact isolation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified artifact to Bella production
        required: true
        default: false
        type: boolean
      confirmation:
        description: Type DEPLOY_BELLA_PRODUCTION
        required: true
        default: ''
        type: string
      expected_sha:
        description: Exact main commit SHA authorized for deployment
        required: true
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and verify isolated artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Run isolation tests
        run: python -m unittest -v tests/test_pages_artifact_isolation.py
      - name: Build public artifact
        run: python scripts/build-pages-artifact.py
      - name: Verify public artifact
        run: python scripts/verify-pages-artifact.py
      - name: Smoke-check artifact entry points
        run: |
          python - <<'PY'
          from pathlib import Path
          for entry in ('index.html', 'price.html'):
              path = Path('_site', entry)
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'missing or empty artifact entry point: {entry}')
          PY
      - name: Upload isolated Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: _site
          retention-days: 1
          include-hidden-files: true

  deploy:
    name: Manual exact-SHA production deploy
    needs: build
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          inputs.deploy == true &&
          inputs.confirmation == 'DEPLOY_BELLA_PRODUCTION' &&
          inputs.expected_sha == github.sha &&
          github.repository == 'optidigitalagent/bella' &&
          github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy the artifact from this run
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
